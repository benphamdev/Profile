name: Continuous Integration and Deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Run linter
        run: npm run lint

      - name: Run formatter
        run: npm run format

      # - name: Check commit message
      #   uses: wagoid/commitlint-github-action@v3
      #   with:
      #     configFile: commitlint.config.cjs
      - name: Set up environment variables
        id: set-version
        run: |
          VERSION=$(grep -oP '"version": "\K(.*)(?=")' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$(grep -oP '"version": "\K(.*)(?=")' package.json)" >> $GITHUB_OUTPUT

      - name: Build docker image
        id: build-image
        run: docker build -t personal-portfolio-react:${{ steps.set-version.outputs.VERSION }} .

      # If we do this, we don't need to build image during CD below.
      - name: Push Docker Image to Registry
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_ACCESS_TOKEN }}
          docker push personal-portfolio-react:${steps.build-image.outputs.VERSION}

  deploy:
    name: Deploy to Vercel
    needs: build-and-test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # - name: Build docker image
      #   run: docker-compose up --build -d

      - name: Install vercel cli
        run: npm install -g vercel

      - name: Pull and deploy docker image to Vercel
        run: |
          vercel container:login
          vercel container:pull web personal-portfolio-react:${{ env.VERSION }}
          vercel container:release web -a personal-portfolio-react

      - name: Login to Vercel
        run: vercel login --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Tag and push docker image to Vercel
        run: |
          docker tag personal-portfolio-react:latest registry.vercel.com/personal-portfolio-react/web
          docker push registry.vercel.com/personal-portfolio-react/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Release the image to Vercel
        run: vercel container:release web -a personal-portfolio-react
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
