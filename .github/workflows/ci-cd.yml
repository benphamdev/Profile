name: Continuous Integration and Deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Run linter
        run: npm run lint

      - name: Run formatter
        run: npm run format

      # - name: Check commit message
      #   uses: wagoid/commitlint-github-action@v3
      #   with:
      #     configFile: commitlint.config.cjs

      - name: Build docker image
        run: docker build -t personal-portfolio-react:latest .

      # If we do this, we don't need to build image during CD below.
      - name: Push Docker Image to Registry
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker push personal-portfolio-react:latest

  deploy:
    name: Deploy to Heroku
    needs: build-and-test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # - name: Build docker image
      #   run: docker-compose up --build -d

      - name: Pull and deploy docker image to Heroku
        run: |
          heroku container:login
          heroku container:pull web personal-portfolio-react:latest
          heroku container:release web -a personal-portfolio-react

      - name: Login to Heroku
        run: heroku container:login
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      - name: Tag and push docker image to Heroku
        run: |
          docker tag personal-portfolio-react:latest registry.heroku.com/personal-portfolio-react/web
          docker push registry.heroku.com/personal-portfolio-react/web
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      - name: Release the image to Heroku
        run: heroku container:release web -a personal-portfolio-react
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
